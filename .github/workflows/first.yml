name: "First Workflow"
on: 
  push:
  pull_request:
    branches:
      - main
      - dev
      - qa

jobs: 
  first_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: 24
          cache: "npm"

      - name: install dependencies
        run: npm ci  

      - name: run ESLint in app
        run: npm run lint  

  second_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: 24
          cache: "npm"

      - name: install dependencies
        run: npm ci  

      - name: make react build
        run: npm run build

      - name: create artifacts
        uses: actions/upload-artifact@v4
        with: 
          name: react-build
          path: dist/
          retention-days: 7 
          
